name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push on the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests on PostgreSQL + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile, unit + web + repository + integration tests (Testcontainers
      # uses the runner's Docker), JaCoCo report, and the 90% coverage gate.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
                   END { printf "### Backend line coverage: %.1f%%\n", 100 * covered / (missed + covered) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (tests + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

  docker:
    name: Docker stack (build + end-to-end smoke test)
    needs: [backend, frontend] # only build images from code that passed its tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # A throwaway secret, generated for this run only and never stored.
      - name: Create runtime configuration
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" > backend/.env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
