# nginx is the single entry point: it serves the Angular files and forwards /api
# to the backend. The browser sees one origin, so no CORS is needed in production
# either, and the backend is not exposed outside the Docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off; # do not advertise the nginx version

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names contain a content hash (main-PHCVM6R4.js): safe to cache for a year.
    location ~* \.(?:js|css|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page application: unknown paths (/applications/3/edit) return index.html
    # and the Angular router takes over. index.html is never cached, so a new
    # deployment is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
