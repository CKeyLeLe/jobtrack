<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="7" width="18" height="13" rx="2.5" />
        <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" />
        <path d="m8.5 13.5 2.5 2.5 4.5-4.5" />
      </svg>
      JobTrack
    </a>

    @if (auth.isAuthenticated()) {
      <nav class="nav" aria-label="Main">
        <a routerLink="/applications" routerLinkActive="active">Applications</a>
        <a routerLink="/follow-ups" routerLinkActive="active">Follow-ups</a>
      </nav>
      <div class="account">
        <span class="account-email">{{ auth.email() }}</span>
        <button class="btn btn-small" type="button" (click)="auth.logout()">Log out</button>
      </div>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
